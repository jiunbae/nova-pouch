name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: registry.jiun.dev
  IMAGE_NAME: nova-pouch
  IAC_REPO: jiunbae/IaC
  OVERLAY_PROD: kubernetes/overlays/prod/nova-pouch
  OVERLAY_DEV: kubernetes/overlays/dev/nova-pouch

jobs:
  verify:
    runs-on: ubuntu-latest
    # Browser and its system libraries come baked into the image (chromium-1208
    # matches playwright 1.58.2 in bun.lock). Installing them per run meant a
    # 167 MiB download plus apt, and the LAN path corrupts large concurrent
    # downloads (2026-10-26/27: Hash Sum mismatch, truncated browser zip).
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble@sha256:6446946a1d9fd62d9ae501312a2d76a43ee688542b21622056a372959b65d63d
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      # setup-bun needs unzip, which the Playwright image lacks; npm verifies
      # the package integrity hash, so a corrupted download fails and retries.
      - name: Set up Bun
        run: npm install -g bun@1.4.4 && bun --version

      # Fails if bun.lock is out of sync with package.json, which is what broke
      # the pipeline in run #5 -- previously only surfaced inside the Docker build.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (frontend)
        run: bun run typecheck:app

      - name: Typecheck (server)
        run: bun run typecheck:server

      - name: Build frontend
        run: bun run build

      - name: Build server
        run: bun run build:server

      - name: Run E2E tests
        run: bun run test:e2e

  build:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ gitea.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max

  update-manifests:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Clone IaC repo from GitHub
        run: |
          git clone https://x-access-token:${{ secrets.IAC_GITHUB_TOKEN }}@github.com/${{ env.IAC_REPO }}.git iac

      - name: Update image tags in IaC repo
        run: |
          cd iac
          sed -i "s/newTag: .*/newTag: ${{ gitea.sha }}/" ${{ env.OVERLAY_DEV }}/kustomization.yaml
          sed -i "s/newTag: .*/newTag: ${{ gitea.sha }}/" ${{ env.OVERLAY_PROD }}/kustomization.yaml

      - name: Commit and push to IaC repo
        run: |
          cd iac
          git config user.name "Gitea Actions"
          git config user.email "actions@gitea.jiun.dev"
          git add ${{ env.OVERLAY_DEV }}/kustomization.yaml ${{ env.OVERLAY_PROD }}/kustomization.yaml
          git diff --staged --quiet || git commit -m "chore(nova-pouch): update image tag to ${{ gitea.sha }}"
          git push
